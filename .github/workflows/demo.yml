name: demo

on: workflow_dispatch

jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fresh clone to first gate
        run: bash scripts/fresh_clone_test.sh https://github.com/${{ github.repository }}.git
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-clone-logs
          path: /tmp/fresh-clone-logs/*.log
          if-no-files-found: ignore
