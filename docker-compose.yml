services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge -d modelforge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
