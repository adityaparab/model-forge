services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge -d modelforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODELFORGE_DATABASE_URL: postgresql://modelforge:modelforge@postgres:5432/modelforge
      MODELFORGE_LOG_LEVEL: INFO
    volumes:
      - ./artifacts:/data/artifacts
      - ./data:/data/datasets
    command: ["worker"]
    restart: unless-stopped

volumes:
  pgdata:
