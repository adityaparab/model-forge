[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelforge-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modelforge-core",
    "modelforge-lineage",
    "mcp>=2.3",
    "jinja2>=3.1",
    "markdown-it-py>=3",
    "pyyaml>=6",
    "structlog>=26",
    "pandas>=2.2",
]

[project.scripts]
modelforge-mcp = "modelforge_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["modelforge_mcp"]
