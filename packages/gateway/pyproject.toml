[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelforge-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modelforge-core",
    "modelforge-lineage",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-ollama>=1.1",
    "langchain-openai>=1.7",
    "jinja2>=3.1",
    "pyyaml>=6",
    "structlog>=26",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["modelforge_gateway"]
