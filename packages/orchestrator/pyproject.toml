[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelforge-orchestrator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modelforge-core",
    "modelforge-lineage",
    "modelforge-mcp",
    "modelforge-gateway",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "typer>=0.28",
    "pyyaml>=6",
]

[project.scripts]
modelforge = "modelforge_orchestrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["modelforge_orchestrator"]
