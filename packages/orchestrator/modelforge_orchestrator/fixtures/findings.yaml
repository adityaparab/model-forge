# Deterministic stand-in for the challenger agent's round-1 findings, keyed by finding id.
F-1:
  severity: medium
  category: data
  title: Default and vintage definitions rely on dataset proxies
  description: >-
    The target treats bankruptcy within the forecast horizon as the default event, and the
    dataset's horizon files are treated as origination vintages. Neither matches a lender's
    default definition or calendar-time vintages, so performance and stability results may not
    transfer to a production portfolio.
  required_action: >-
    Document both proxies and their expected impact as known limitations, and state the
    conditions under which the model may be relied on.
F-2:
  severity: high
  category: performance
  title: Calibration test does not pass on the evaluation sample
  description: >-
    The binomial calibration test on the evaluation sample does not pass, so predicted default
    probabilities may not match observed default rates in some score bands.
  required_action: >-
    Recalibrate the model or document the calibration weakness, its impact on intended use and
    the monitoring that compensates for it.
