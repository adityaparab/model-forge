[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelforge-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pydantic>=2.7",
    "pyarrow>=16",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["modelforge_core"]
